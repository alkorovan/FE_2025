<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Cards 0_0</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #dec1c1;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    #spinner {
      display: none;
      text-align: center;
      font-size: 1.2rem;
    }

    .layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      position: relative;
    }

    .card {
      background: rgb(255, 245, 245);
      border-radius: 12px;
      width: 300px;
      padding: 1rem;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.25s ease;
      position: relative;
      z-index: 1;
    }

    .card:hover {
      transform: scale(1.25);
      z-index: 10;
    }

    .username {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .tag {
      color: #777;
      margin-bottom: 0.5rem;
    }

    .details {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      border-top: 1px solid #eee;
      padding-top: 0.5rem;
    }

    .actions {
      margin-top: 0.5rem;
      display: flex;
      gap: 0.5rem;
    }

    .actions button {
      flex: 1;
      padding: 0.4rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .edit-btn {
      background: #4ef297;
      color: white;
    }

    .delete-btn {
      background: #f6b529;
      color: white;
    }

    .form-edit {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      width: 300px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      align-self: flex-start;
    }

    .form-edit input {
      display: block;
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .form-edit button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="spinner">Loading...</div>
  <div class="layout">
    <div class="card-list" id="cardList"></div>

    <div class="form-edit hidden" id="editForm">
      <h3>Edit User :D</h3>
      <input type="text" id="nameInput" placeholder="Name" />
      <input type="text" id="usernameInput" placeholder="Username" />
      <input type="text" id="phoneInput" placeholder="Phone" />
      <input type="text" id="websiteInput" placeholder="Website" />
      <input type="text" id="emailInput" placeholder="Email" />
      <button id="saveBtn">Save xD</button>
    </div>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
